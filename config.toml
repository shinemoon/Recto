# 云阅 Recto 运行时配置
#
# 这份是**可以入库的默认配置**：不含任何机器专有路径，clone 下来直接跑就落到
# <项目根>/data 与 <项目根>/library。
#
# 想换到别处有三种方式（优先级从低到高）:
#   1. 直接改本文件（注意别把机器路径提交上去）
#   2. 写一份 config.toml.local（同名同格式，逐键覆盖本文件，**不入库**，推荐）
#   3. 环境变量（见 src/recto/core/config.py 的 _apply_env，容器化主要靠这个）
#
# 云阅 Recto 是独立服务: 不依赖本地书库容器, 也不读写任何外部书目数据库。

[recto]
host = "0.0.0.0"
port = 5015
data_dir = ""                     # 空 = <项目根>/data

# --- 书库 (Recto 自己的目录) ---
# 只放原书 (epub / txt)。扫描递归。
# 每本书的 JSON 默认跟原书同目录: <书名>.recto.json (云端映射 / 处理状态)
# 选项: [library] 也可以写 dirs = [ ... ] 配多个根目录
[library]
dir = ""                          # 空 = <项目根>/library

# --- 云端阅读服务 (掌阅) ---
[cloud]
auth_file = ""                    # 空 = <项目根>/config/secrets/cloud.json
state_dir = ""                    # 空 = <data_dir>/state
download_subdir = ""              # 空 = 直接下到 library.dir 根下

# --- 墨水屏设备接入 ---
# 协议与端口都不能变 (设备固件写死了), 但实现并入云阅 Recto 同一进程
[device]
port = 8080
data_dir = ""                     # 空 = <data_dir>

# --- 术语语料 (EPUB 关键字精炼, 本服务内置) ---
# 语料根之下: config.json (LLM 端点/模型库) · state.json · outputs/ (中间产物)
#             与 <书名>-<hash>.json 固定导出 (下游语料消费方直接扫这一层)
[corpus]
dir = ""                          # 空 = <data_dir>/corpus

# --- 阅读高亮 (语料分解 json → 阅读器里的关键词滤镜) ---
# 这里是**部署默认值**; 用的人在设置页「阅读高亮」卡里改的覆盖项存在
# <data_dir>/reading_mark.json, 缺的键就跟随这里。
[reader.mark]
enabled = true
mode = "highlight"        # highlight = 不改一个字符 (只上色) | span = 包 <span>, 可加粗/圆角
dirs = []                 # 空 = 用上面 [corpus] dir
min_len = 2               # 词里至少几个字母/汉字才高亮
max_terms = 6000          # 最多下发多少词 (按分类公平分配, 不会让人名吃光)
skip_digits = true        # 纯数字词 (1981 / 13) 不高亮

# --- 藏书票渲染 (可选组件) ---
# asset_root 要指向一套带模板与前端依赖的目录 (templates/ + bin/node_modules/)。
# 空 = <data_dir>/assets/bookplate —— 没有这套素材时藏书票会明确报错, 其它功能不受影响。
[bookplate]
asset_root = ""
output_dir = ""                   # 空 = <data_dir>/bookplate/out
node_dirs = []                    # 找 node 时额外的 nvm 根目录, 例如 ["/opt/node/.nvm"]

# --- 界面时区 ---
# 只影响「显示这一层」的换算, 不改变任何存盘格式 (存盘一律本地时间)。
# 空 = 跟随系统 (/etc/timezone); 想固定就写 IANA 名, 环境变量 RECTO_TZ 优先。
[ui]
timezone = ""                     # 例如 "Asia/Shanghai"

# --- 控制台登录 ---
[auth]
mode = "password"                 # password | none
user = "root"                     # 登录用户名 (首次启动的默认值)
password = ""                     # 空 = 读环境 RECTO_AUTH_PASSWORD 或 <data_dir>/admin-password (首次生成)
shared_dir = ""                   # 空 = <项目根>/config/webauth (同机多服务共享会话密钥时指到同一目录)
ttl_days = 7

# --- 同步策略 (本地阅读 ⇄ 云端阅读服务) ---
# 这几项都能在「设置 → 云端同步」里改, 改完立刻生效 (落 settings.json);
# 这里写的是部署默认值, 环境变量 RECTO_SYNC_* 优先级最高。
[sync]
auto = true                     # 总开关: 阅读中自动推送 + 打开书时自动拉取
pull_on_open = true             # 打开一本书时先跟云端对一次进度 (云端更靠前就跳过去)
push_debounce_sec = 12          # 两次推送至少隔多久 (太小会一直打云端)
pull_gap_sec = 120              # 同一本书两次自动拉取的间隔
flush_on_hide = true            # 切后台 / 离开页面时立刻把最后位置推上去 (不等节流)
stamp = true                    # 阅读页右下角显示「掌阅 15:37 已同步 32.4%」

# 定时同步 (心跳通道) —— 与「翻页触发」并行的那一条。
# 翻页推送解决"读者动了"; 定时器解决"停在一页上看很久 / 加了划线没翻页 /
# 页面已经关了但时长还没推"。只在**最近读过**的书上干活, 没活动就完全不联网。
interval_sec = 60               # 心跳周期; 0 = 关闭定时同步
tick_active_min = 30            # 只同步最近 N 分钟内动过进度的书
tick_notes = true               # 顺带同步划线 / 书签
tick_notes_sec = 300            # 划线多久看一次 (比心跳稀疏)
tick_time = true                # 顺带推送今天的阅读时长
tick_time_sec = 600             # 时长多久推一次
